# CI: compile the library and run unit tests (incl. the HMAC signature parity
# vector shared with the server and the iOS SDK). The repo intentionally ships
# without a committed Gradle wrapper binary; setup-gradle provisions Gradle so
# `gradle` is on PATH. Android SDK platform-34 is pre-installed on the runner.
name: Android CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGP 8.5.2 requires JDK 17+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Unit tests first (fast fail on the signature parity vector), then the
      # release AAR to prove the library compiles.
      - run: gradle :trackhub:test :trackhub:assembleRelease :trackhub:assembleDebugAndroidTest --no-daemon --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # GitHub's emulator occasionally loses its adb daemon before or
          # during instrumentation (the same commit then passes on the tag
          # runner). Retry exactly once after rebuilding the adb connection;
          # a deterministic SDK/test failure still fails both attempts.
          script: bash .github/run-android-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trackhub-release-aar
          path: trackhub/build/outputs/aar/*.aar
          if-no-files-found: ignore
